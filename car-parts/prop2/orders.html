<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلباتي السابقة - Motors Parts DZ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .order-card { background: white; border: 1.5px solid var(--border-color); border-radius: 16px; padding: 20px; margin-bottom: 16px; transition: 0.2s; }
        .order-card:hover { border-color: #a0aec0; }
        .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e8e0d4; padding-bottom: 12px; margin-bottom: 12px; }
        .order-id { font-size: 18px; font-weight: 900; color: #1a5fa8; }
        .order-date { font-size: 13px; color: var(--text-muted); }
        .badge-wait { background: #fff4ed; color: #e8650a; border: 1px solid #f5c4a0; border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 700; }
        .badge-ok { background: #eef5f1; color: var(--success); border: 1px solid #d4e6db; border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 700; }
        .badge-fail { background: #fee2e2; color: #c0392b; border: 1px solid #fca5a5; border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 700; }
    </style>
</head>
<body>

    <nav class="custom-navbar sticky-top d-flex justify-content-between align-items-center">
        <a href="index.html" class="brand-logo">MotorsParts <span>DZ</span></a>
        <div class="d-none d-md-flex align-items-center gap-4">
            <a href="index.html" class="nav-link-custom">البحث</a>
            <a href="orders.html" class="nav-link-custom" style="color: var(--primary);">طلباتي السابقة</a>
        </div>
        <a href="index.html" class="btn btn-outline-light btn-sm" style="border-radius: 6px; font-weight: 700;">رجوع</a>
    </nav>

    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold m-0">📦 سجل طلباتي</h3>
        </div>

        <div class="row">
            <div class="col-12 col-lg-8 mx-auto">
                
                <!-- طلب في الانتظار -->
                <div class="order-card">
                    <div class="order-header">
                        <div>
                            <span class="order-id">#ORD-2048</span>
                            <div class="order-date">اليوم، 14:30 مسائاً</div>
                        </div>
                        <span class="badge-wait">⏳ بانتظار رد المورد A</span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <div style="font-size: 14px; font-weight: 500;">طرمبة ماء + 1 منتجات أخرى</div>
                        <div class="fw-bold fs-5">~ 5,000 دج</div>
                    </div>
                </div>

                <!-- طلب مؤكد -->
                <div class="order-card">
                    <div class="order-header">
                        <div>
                            <span class="order-id">#ORD-2047</span>
                            <div class="order-date">أمس، 10:15 صباحاً</div>
                        </div>
                        <span class="badge-ok">✅ تم التأكيد من المورد B</span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <div style="font-size: 14px; font-weight: 500;">فيلتر هواء Daewoo</div>
                        <div class="fw-bold fs-5">850 دج</div>
                    </div>
                    <div class="mt-3 text-start">
                        <button class="btn btn-sm btn-outline-dark" style="border-radius: 6px; font-weight: 700; font-size: 12px;">🔄 إعادة الطلب</button>
                    </div>
                </div>

                <!-- طلب مرفوض -->
                <div class="order-card opacity-75">
                    <div class="order-header">
                        <div>
                            <span class="order-id">#ORD-2040</span>
                            <div class="order-date">الأسبوع الماضي</div>
                        </div>
                        <span class="badge-fail">❌ غير متوفر لدى المورد C</span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <div style="font-size: 14px; font-weight: 500;">مساعد أمامي Kia</div>
                        <div class="fw-bold fs-5 text-decoration-line-through text-muted">5,200 دج</div>
                    </div>
                </div>

            </div>
        </div>
    </main>

</body>
</html>
