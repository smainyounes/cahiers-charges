<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب تاجر - Motors Parts DZ</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card text-center" style="max-width: 550px;">
            <div class="mb-4">
                <h3 class="fw-bold" style="color: var(--text-dark);">إنشاء حساب تاجر جديد</h3>
                <p class="text-muted mt-2" style="font-size: 14px;">انضم لشبكة الموردين واحصل على أفضل عروض قطع الغيار</p>
            </div>

            <form onsubmit="handleRegister(event)" class="text-start">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label-custom">اسم المحل التجاري</label>
                        <input type="text" class="form-control form-control-custom" placeholder="مثال: قطع غيار الأمانة" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label-custom">الولاية</label>
                        <select class="form-select form-control-custom" required>
                            <option value="" disabled selected>اختر الولاية...</option>
                            <option value="16">الجزائر العاصمة</option>
                            <option value="31">وهران</option>
                            <option value="25">قسنطينة</option>
                            <option value="19">سطيف</option>
                            <!-- يمكن إضافة باقي الولايات -->
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label-custom">رقم الهاتف (للتواصل وتأكيد الطلبات)</label>
                    <input type="tel" class="form-control form-control-custom" placeholder="05XX XX XX XX" required>
                </div>
                
                <div class="mb-4">
                    <label class="form-label-custom">كلمة المرور</label>
                    <input type="password" class="form-control form-control-custom" placeholder="يجب ألا تقل عن 8 أحرف" required>
                </div>

                <button type="submit" class="btn-primary-custom fs-5">إنشاء الحساب</button>
            </form>

            <div class="mt-4" style="font-size: 14px; color: var(--text-muted);">
                لديك حساب بالفعل؟ 
                <a href="login.html" class="text-primary-custom">تسجيل الدخول</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
