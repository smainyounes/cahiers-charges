<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Motors Parts DZ</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card text-center">
            <div class="mb-4">
                <a href="#" class="brand-logo fs-3" style="color: #1a1208;">MotorsParts <span style="color: var(--primary)">DZ</span></a>
                <p class="text-muted mt-2" style="font-size: 14px;">بوابة التجار للبحث وطلب قطع الغيار</p>
            </div>

            <form onsubmit="handleLogin(event)" class="text-start">
                <div class="mb-3">
                    <label class="form-label-custom">رقم الهاتف</label>
                    <input type="tel" class="form-control form-control-custom" placeholder="05XX XX XX XX" required>
                </div>
                
                <div class="mb-4">
                    <label class="form-label-custom d-flex justify-content-between">
                        كلمة المرور
                        <a href="#" class="text-primary-custom" style="font-size: 12px; font-weight: 500;">نسيت كلمة المرور؟</a>
                    </label>
                    <input type="password" class="form-control form-control-custom" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary-custom fs-5">تسجيل الدخول</button>
            </form>

            <div class="mt-4" style="font-size: 14px; color: var(--text-muted);">
                ليس لديك حساب تاجر؟ 
                <a href="register.html" class="text-primary-custom">سجل محلك الآن</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
