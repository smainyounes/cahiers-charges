<!-- pages/login.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Motors Parts DZ</title>
    
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- التنسيقات -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <!-- الشعار -->
        <div class="auth-logo">
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <!-- <i class="fa-solid fa-gear me-2"></i> Motors Parts -->
                <img class="img-fluid" style="width: 80px;" src="../images/logo.webp" alt="">
            </a>
        </div>
        
        <h3 class="auth-title">مرحباً بعودتك</h3>

        <form action="products.html" method="GET">
            <!-- البريد الإلكتروني -->
            <div class="mb-4">
                <label for="email" class="form-label">البريد الإلكتروني</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-secondary" style="border-color: var(--border-color);">
                        <i class="fa-regular fa-envelope"></i>
                    </span>
                    <input type="email" class="form-control border-start-0" id="email" placeholder="أدخل بريدك الإلكتروني" required>
                </div>
            </div>

            <!-- كلمة المرور -->
            <div class="mb-3">
                <label for="password" class="form-label">كلمة المرور</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-secondary" style="border-color: var(--border-color);">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" class="form-control border-start-0" id="password" placeholder="أدخل كلمة المرور" required>
                </div>
            </div>

            <!-- تذكرني & نسيان كلمة المرور -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label text-secondary" for="rememberMe" style="font-size: 0.9rem;">
                        تذكرني
                    </label>
                </div>
                <a href="#" style="color: var(--text-secondary); text-decoration: none; font-size: 0.9rem;">نسيت كلمة المرور؟</a>
            </div>

            <!-- زر الدخول -->
            <button type="submit" class="btn btn-gold w-100 py-2">تسجيل الدخول</button>
        </form>

        <!-- رابط التسجيل -->
        <div class="auth-links">
            <span class="text-secondary">ليس لديك حساب؟</span>
            <a href="register.html">إنشاء حساب جديد</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
