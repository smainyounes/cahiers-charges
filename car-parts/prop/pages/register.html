<!-- pages/register.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب | Motors Parts DZ</title>
    
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- التنسيقات -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">

    <div class="auth-card" style="max-width: 550px;">
        <!-- الشعار -->
        <div class="auth-logo mb-2">
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <!-- <i class="fa-solid fa-gear me-2"></i> Motors Parts -->
                <img class="img-fluid" style="width: 80px;" src="../images/logo.webp" alt="">
            </a>
        </div>
        
        <h3 class="auth-title mb-4">إنشاء حساب جديد</h3>

        <form action="login.html" method="GET">
            <!-- اختيار نوع الحساب -->
            <label class="form-label text-center d-block mb-3">نوع الحساب</label>
            <div class="role-selector">
                <div class="role-option">
                    <input type="radio" name="account_type" id="role_buyer" value="buyer" checked>
                    <label class="role-label" for="role_buyer">
                        <i class="fa-solid fa-store d-block mb-2 fs-4"></i>
                        تاجر (مشتري)
                    </label>
                </div>
                <div class="role-option">
                    <input type="radio" name="account_type" id="role_supplier" value="supplier">
                    <label class="role-label" for="role_supplier">
                        <i class="fa-solid fa-truck-fast d-block mb-2 fs-4"></i>
                        مورد (بائع)
                    </label>
                </div>
            </div>

            <div class="row">
                <!-- اسم المحل / الشركة -->
                <div class="col-md-6 mb-3">
                    <label for="companyName" class="form-label">اسم المحل / الشركة</label>
                    <input type="text" class="form-control" id="companyName" placeholder="اسم نشاطك التجاري" required>
                </div>
                
                <!-- رقم الهاتف -->
                <div class="col-md-6 mb-3">
                    <label for="phone" class="form-label">رقم الهاتف</label>
                    <input type="tel" class="form-control" id="phone" placeholder="0555 00 00 00" dir="ltr" style="text-align: right;" required>
                </div>
            </div>

            <!-- البريد الإلكتروني -->
            <div class="mb-3">
                <label for="email" class="form-label">البريد الإلكتروني</label>
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
            </div>

            <div class="row">
                <!-- كلمة المرور -->
                <div class="col-md-6 mb-3">
                    <label for="password" class="form-label">كلمة المرور</label>
                    <input type="password" class="form-control" id="password" placeholder="كلمة المرور" required>
                </div>
                
                <!-- تأكيد كلمة المرور -->
                <div class="col-md-6 mb-4">
                    <label for="confirmPassword" class="form-label">تأكيد كلمة المرور</label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="تأكيد كلمة المرور" required>
                </div>
            </div>

            <!-- الشروط والأحكام -->
            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="terms" required>
                <label class="form-check-label text-secondary" for="terms" style="font-size: 0.9rem;">
                    أوافق على <a href="#" class="text-gold">الشروط والأحكام</a> وسياسة الخصوصية
                </label>
            </div>

            <!-- زر التسجيل -->
            <button type="submit" class="btn btn-gold w-100 py-2">إنشاء الحساب</button>
        </form>

        <!-- رابط الدخول -->
        <div class="auth-links">
            <span class="text-secondary">لديك حساب بالفعل؟</span>
            <a href="login.html">تسجيل الدخول</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
